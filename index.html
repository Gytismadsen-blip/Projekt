<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoTools</title>
  <link rel="stylesheet" href="/platform/platform.css">
  <style>html.pf-auth-pending body > :not(.pf-auth-error){visibility:hidden!important}</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/platform/auth.js"></script>
  <script src="/platform/nav.js" defer></script>
</head>
<body class="pf-home">
  <main class="pf-main">
    <div class="pf-heading"><p>CargoTools</p><h1>Vælg dit værktøj</h1></div>
    <figure class="pf-journey">
      <picture><source srcset="/billeder/hero.webp" type="image/webp"><img src="/billeder/hero.png" width="2400" height="640" alt="Varens rejse fra afsender til modtager med skib, fly og lastbil"></picture>
      <figcaption class="pf-stations"><span>Afsender</span><span>Sø</span><span>Luft</span><span>Vej</span><span>Modtager</span></figcaption>
    </figure>
    <div class="pf-cards">
      <a class="pf-card" href="/fragtanalyse/"><picture><source srcset="/billeder/ikon_fragt.webp" type="image/webp"><img class="pf-icon" src="/billeder/ikon_fragt.png" width="512" height="512" alt=""></picture><h2>FragtAnalyse</h2><p>Sammenlign fragtpriser</p></a>
      <a class="pf-card" href="/turberegner/"><picture><source srcset="/billeder/ikon_tur.webp" type="image/webp"><img class="pf-icon" src="/billeder/ikon_tur.png" width="512" height="512" alt=""></picture><h2>Turberegner</h2><p>Beregn din køretur</p></a>
      <a class="pf-card" href="/ansvarsanalyse/"><picture><source srcset="/billeder/ikon_ansvar.webp" type="image/webp"><img class="pf-icon" src="/billeder/ikon_ansvar.png" width="512" height="512" alt=""></picture><h2>AnsvarsAnalyse</h2><p>Få styr på transportansvar</p></a>
      <a class="pf-card" href="/regnemaskine/"><picture><source srcset="/billeder/ikon_regne.webp" type="image/webp"><img class="pf-icon" src="/billeder/ikon_regne.png" width="512" height="512" alt=""></picture><h2>Regnemaskine</h2><p>Beregn logistik og økonomi</p></a>
    </div>
  </main>
  <noscript><div class="pf-auth-error">Slå JavaScript til for at logge ind.</div></noscript>
</body>
</html>
